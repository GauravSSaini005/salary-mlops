apiVersion: apps/v1
kind: Deployment
metadata:
  name: salary-mlops
  namespace: default
  labels:
    app: salary-mlops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: salary-mlops
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: salary-mlops
    spec:
      containers:
        - name: salary-api
          image: ghcr.io/YOUR_GITHUB_USERNAME/salary-mlops:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: "production"
            - name: PORT
              value: "5000"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      imagePullSecrets:
        - name: ghcr-secret