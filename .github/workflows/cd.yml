# ============================================================
# CD — Continuous Delivery
# Triggers: push to main only
# Jobs: Pipeline -> Docker Build -> Push to GHCR -> Deploy to K8s
# ============================================================

name: CD - Docker Build and Deploy

# This workflow runs automatically when code is pushed to main,
# or can be triggered manually from the GitHub Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# IMAGE_NAME is hardcoded in lowercase because GitHub Container Registry
# requires all image names to be lowercase. Using github.repository directly
# would produce GauravSSaini005/salary-mlops which GHCR rejects.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gauravssaini005/salary-mlops

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Run ML Pipeline
  # Runs the full ML pipeline before building the Docker image.
  # This ensures the image always contains a freshly trained, evaluated model.
  # If any step fails (e.g. model below R2 threshold), the image is not built.
  # ---------------------------------------------------------------------------
  pipeline:
    name: Run ML Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      # Preprocess the raw CSV into train/test splits
      - run: python src/preprocess.py --data data/salary_data.csv

      # Train the Random Forest model and save it to models/
      - run: mkdir -p models && python src/train.py

      # Evaluate the model — exits with code 1 if R2 is below 0.80,
      # which causes this job to fail and stops the Docker build
      - run: python src/evaluate.py --model models/model_stable.joblib

      # Run all 6 unit tests — if any fail, the pipeline stops here
      - run: pytest tests/ -v --tb=short

      # Upload the trained model so the docker job can download and bake it in
      - uses: actions/upload-artifact@v4
        with:
          name: production-model
          path: |
            models/
            metrics.json

  # ---------------------------------------------------------------------------
  # Job 2: Build and Push Docker Image
  # Only runs after the ML pipeline job passes.
  # Builds a multi-stage Docker image containing the trained model and Flask API,
  # then pushes it to GitHub Container Registry with two tags:
  #   - latest: always points to the newest image on main
  #   - sha-<commit>: a unique immutable tag for this exact commit
  # ---------------------------------------------------------------------------
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: pipeline
    permissions:
      contents: read   # needed to check out the repository
      packages: write  # needed to push the image to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      # Download the model files trained in the pipeline job above
      - uses: actions/download-artifact@v4
        with:
          name: production-model
          path: .

      # Log in to GitHub Container Registry using the built-in token
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image tags and labels from git metadata
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Set up Docker Buildx for layer caching
      - uses: docker/setup-buildx-action@v3

      # Build the image using the Dockerfile and push it to GHCR
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to Kubernetes
  # Only runs after the Docker image is successfully pushed.
  # Uses a self-hosted runner on the Google Cloud VM so it has direct
  # network access to the Kind Kubernetes cluster running on that VM.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: docker
    steps:
      - uses: actions/checkout@v4

      # Install kubectl on the self-hosted runner
      - uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      # Decode the kubeconfig from the GitHub secret and write it to disk.
      # The secret contains a base64-encoded kubeconfig file.
      # chmod 600 ensures only the current user can read the credentials.
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.VM_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # Create or update the GHCR pull secret so Kubernetes can pull the image.
      # dry-run=client + apply is idempotent — safe to run on every deployment.
      - name: Create GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=default \
            --dry-run=client -o yaml | kubectl apply -f -

      # Replace the placeholder image name in deployment.yaml with the real
      # lowercase image name before applying it to the cluster.
      - name: Update image in deployment
        run: |
          sed -i "s|ghcr.io/gauravssaini005/salary-mlops:latest|ghcr.io/${{ env.IMAGE_NAME }}:latest|g" \
            k8s/deployment.yaml

      # Apply all three Kubernetes manifests to the cluster.
      # kubectl apply is idempotent — it creates or updates as needed.
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # Wait for the rolling update to complete before running the smoke test.
      # If pods do not become ready within 120 seconds, this step fails.
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/salary-mlops \
            --namespace=default \
            --timeout=120s

      # Send a real HTTP request to the /health endpoint to confirm the API
      # is responding correctly after deployment.
      - name: Smoke test
        run: |
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[0].address}')
          sleep 10
          curl -sf http://${NODE_IP}:30500/health

      # If any step above failed, automatically roll back to the previous
      # Kubernetes deployment revision. This keeps the service available
      # even when a bad deployment is pushed.
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back to previous revision..."
          kubectl rollout undo deployment/salary-mlops 2>/dev/null || \
            echo "No previous revision to rollback to"
          kubectl rollout status deployment/salary-mlops \
            --timeout=60s 2>/dev/null || echo "Rollback status check skipped"