# ============================================================
# CT — Continuous Training
# Triggers:
#   1. Weekly schedule
#   2. New data pushed
#   3. Manual trigger
#
# Flow:
# Check model → Retrain if needed → Build image → Redeploy
# ============================================================

name: CT - Continuous Training

on:
  # Every Monday at 02:00 UTC
  schedule:
    - cron: "0 2 * * 1"

  # Trigger only when dataset changes
  push:
    paths:
      - "data/salary_data.csv"
    branches:
      - main
      - develop

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Force retraining even if model passes evaluation"
        required: false
        default: false
        type: boolean

jobs:

  # ============================================================
  # JOB 1 — CHECK MODEL PERFORMANCE
  # ============================================================
  check-performance:
    name: Check Current Model Performance
    runs-on: ubuntu-latest

    outputs:
      needs_retraining: ${{ steps.check.outputs.needs_retraining }}
      current_r2: ${{ steps.check.outputs.current_r2 }}

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Preprocess latest dataset
      - name: Preprocess data
        run: python src/preprocess.py --data data/salary_data.csv

      # Evaluate current model
      - name: Check model performance
        id: check
        shell: bash
        run: |

          # Safe fallback for non-workflow_dispatch events
          FORCE_RETRAIN="${{ github.event.inputs.force_retrain || 'false' }}"

          # If no model exists yet → force training
          if [ ! -f "models/model_stable.joblib" ]; then

            echo "No stable model found."

            echo "needs_retraining=true" >> $GITHUB_OUTPUT
            echo "current_r2=0.0" >> $GITHUB_OUTPUT

          else

            # Evaluate model
            python src/evaluate.py --model models/model_stable.joblib
            EVAL_EXIT_CODE=$?

            # Read R2 score
            R2=$(python -c "import json; print(json.load(open('metrics.json')).get('r2', 0))")

            echo "current_r2=${R2}" >> $GITHUB_OUTPUT

            # Decide retraining
            if [ $EVAL_EXIT_CODE -ne 0 ] || [ "$FORCE_RETRAIN" = "true" ]; then
              echo "needs_retraining=true" >> $GITHUB_OUTPUT
            else
              echo "needs_retraining=false" >> $GITHUB_OUTPUT
            fi

          fi

      # GitHub Actions summary
      - name: Print summary
        run: |
          echo "## CT Performance Check" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| R2 Threshold | 0.80 |" >> $GITHUB_STEP_SUMMARY
          echo "| Current R2 | ${{ steps.check.outputs.current_r2 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Needs Retraining | ${{ steps.check.outputs.needs_retraining }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 2 — RETRAIN MODEL
  # ============================================================
  retrain:
    name: Retrain Model
    runs-on: ubuntu-latest

    needs: check-performance

    # FIXED:
    # Use bracket notation because job ID contains hyphen
    if: needs['check-performance'].outputs.needs_retraining == 'true'

    permissions:
      contents: write

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Preprocess dataset
      - name: Preprocess data
        run: python src/preprocess.py --data data/salary_data.csv

      # Train model
      - name: Train model
        run: |
          mkdir -p models
          python src/train.py

      # Evaluate newly trained model
      - name: Evaluate trained model
        run: python src/evaluate.py --model models/model_stable.joblib

      # Commit updated model + metrics
      - name: Commit new model
        shell: bash
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add models/ metrics.json

          VERSION=$(python -c "import json; print(json.load(open('metrics.json'))['version'])")

          git commit -m "chore: retrain model ${VERSION} [ct-pipeline]" || echo "Nothing to commit"

          git push origin ${{ github.ref_name }}

      # Upload artifacts for later jobs
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrained-model
          path: |
            models/
            metrics.json

  # ============================================================
  # JOB 3 — BUILD & PUSH DOCKER IMAGE
  # ============================================================
  rebuild-image:
    name: Rebuild Docker Image
    runs-on: ubuntu-latest

    needs: retrain

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout latest branch state
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Convert repo name to lowercase
      - name: Set lowercase repo name
        id: lc
        shell: bash
        run: |
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Build and push Docker image
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.lc.outputs.repo_lc }}:latest
            ghcr.io/${{ steps.lc.outputs.repo_lc }}:ct-${{ github.run_number }}

  # ============================================================
  # JOB 4 — REDEPLOY TO KUBERNETES
  # ============================================================
  redeploy:
    name: Redeploy to Kubernetes

    runs-on: self-hosted

    needs: rebuild-image

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      # Configure kubeconfig
      - name: Configure kubectl
        shell: bash
        run: |

          mkdir -p ~/.kube

          echo "${{ secrets.VM_KUBECONFIG }}" | base64 -d > ~/.kube/config

          chmod 600 ~/.kube/config

      # Rolling restart
      - name: Rolling restart
        shell: bash
        run: |

          kubectl rollout restart deployment/salary-mlops --namespace=default

          kubectl rollout status deployment/salary-mlops --timeout=120s

      # Smoke test
      - name: Smoke test
        shell: bash
        run: |

          sleep 15

          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[0].address}')

          curl -sf http://${NODE_IP}:30500/health

      # Rollback if deployment fails
      - name: Rollback on failure
        if: failure()
        shell: bash
        run: |

          echo "Rolling back after failed CT redeploy..."

          kubectl rollout undo deployment/salary-mlops 2>/dev/null || \
            echo "No previous revision to rollback to"

          kubectl rollout status deployment/salary-mlops \
            --timeout=60s 2>/dev/null || echo "Rollback status check skipped"